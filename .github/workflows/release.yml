name: Release Turbo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.5-turbo)'
        required: false
        default: ''
  push:
    tags: ['v*-turbo']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # [TURBO] 产物共享：APK 由 push CI（build.yml）全 ABI 构建并上传 artifact，
      # 发布不再重复编译。先找到 HEAD commit 对应的成功 Build APK run，
      # 下载其 profileable artifact 直接发布（每次发布省 ~10min 构建）。
      # [FIX] annotated tag push 时 context.sha 是 tag 对象 SHA（非 commit SHA），
      # head_sha 过滤会匹配不到任何 build run → 用 commits API resolve ref
      # （tag 名或分支名均可）拿到真实 commit SHA 再查询。
      - name: Find successful Build APK run for HEAD
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            // 手动触发（workflow_dispatch）时用 inputs.tag 定位发布版本（分支 HEAD
            // 可能是仅 workflow 改动、无 build run 的 commit）；tag 触发时用 context.ref。
            // workflow_dispatch 的 inputs 需从 context.payload.inputs 读取
            // （core.getInput 只读 action 级 with 参数）；commits API 会自动
            // dereference tag → commit SHA。
            const tagInput = context.payload.inputs?.tag ?? '';
            const ref = tagInput !== '' ? tagInput : context.ref;
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
            });
            const commitSha = commit.sha;
            // [FIX] 竞态（2026-08-10 v1.9.4-turbo pro 发布失败）：tag push 通常在
            // master push 后十几秒内触发，而 Build APK 需 ~12min。旧逻辑查不到
            // "已完成的成功 run" 就直接失败 → 发布 run 23s 内死掉、build 12 分钟后
            // 才成功。改为轮询等待：build run 尚在进行时每 3min 重查一次
            // （最长 4min，job timeout 30min 兜底）；该 SHA 的 build run 全部
            // 完成且无一成功（build 失败）时提前报错，避免空等。
            const findOk = (runs) => runs.find(r => r.status === 'completed' && r.conclusion === 'success');
            const deadline = Date.now() + 4 * 60 * 1000;
            let run = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build.yml',
                head_sha: commitSha,
                event: 'push',
                per_page: 10
              });
              run = findOk(data.workflow_runs);
              if (run) break;
              const runs = data.workflow_runs || [];
              // API 按创建时间倒序 → runs[0] 是最新 run；全部已结束且无一成功 → build 失败
              if (runs.length > 0 && runs.every(r => r.status === 'completed')) {
                const latest = runs[0];
                throw new Error(
                  `Build APK runs for ${commitSha} (${ref}) finished without success ` +
                  `(latest run ${latest.id}: ${latest.conclusion}). ` +
                  `Rerun the build CI first, then rerun this release workflow.`
                );
              }
              await new Promise(r => setTimeout(r, 180000));
            }
            if (!run) {
              // throw 会标记 job 失败并中断后续步骤（setFailed 不中断步骤链）
              throw new Error(
                `No successful Build APK run found for ${commitSha} (${ref}) within 4min. ` +
                `Wait for the push CI (Unit Tests + Build APK) to pass before releasing.`
              );
            }
            core.setOutput('run_id', run.id);
            core.setOutput('run_url', run.html_url);

      - name: Download profileable APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            // [FIX] download-artifact@v4 跨 workflow run 下载有兼容问题
            // （run-id 指向其他 workflow 的 run 时报 Artifact not found，即使
            // artifact 存在）。改用 REST API + fetch 直接下载并解压，行为可预期。
            const fs = require('fs');
            const { execSync } = require('child_process');
            const runId = Number('${{ steps.find.outputs.run_id }}');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 30,
            });
            const artifact = artifacts.data.artifacts.find(
              a => a.name === 'rikkahub-turbo-profileable'
            );
            if (!artifact) {
              throw new Error(`Artifact rikkahub-turbo-profileable not found in run ${runId}`);
            }
            // 用 octokit 的 downloadArtifact 端点下载（认证自动处理；直接 fetch
            // archive_download_url 会 401——环境里没有可靠的 token header）
            const resp = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            if (!resp.data) {
              throw new Error('Artifact download returned empty response');
            }
            fs.mkdirSync('app/build/outputs/apk/profileable', { recursive: true });
            fs.writeFileSync('/tmp/profileable.zip', Buffer.from(resp.data));
            execSync('unzip -o /tmp/profileable.zip -d app/build/outputs/apk/profileable');
            console.log(
              `Downloaded ${artifact.name} (${(artifact.size_in_bytes / 1024 / 1024).toFixed(1)} MB)`
            );

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: false
          body: |
            RikkaHub Turbo ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

            ## 异步后台任务队列 + 事件驱动 AI
            - **CI 监控**：AI 调用 `background_task` 工具创建 GitHub Actions 监控，后台轮询状态
            - **自动通知**：CI 完成时弹 Android 通知，结果自动注入关联对话
            - **AI 自动分析**：CI 失败时自动触发 AI 分析错误日志并建议修复
            - **定时器**：支持创建延时任务（秒/分钟/毫秒精度）
            - **Webhook**：GitHub Actions 可直接推送到手机（局域网），即时完成监控
            - **任务管理 UI**：设置 → Background Tasks，查看/取消任务
            - **GitHub Token 配置**：支持私有 repo 监控
            - **指数退避**：轮询间隔自适应（30s→5min），省电省 API 配额
            - **去重**：同 repo+branch 不重复创建监控
            - **REST API**：`/api/tasks/*` 端点（CI 监控/定时器/Webhook/取消）

            ## 技术细节
            - Room DB v24→25（AutoMigration），background_tasks 表含索引
            - 120 轮深度代码审查：竞态修复、JSON 注入防护、Okio API 修正等
            - 自适应轮询（5s active / 30s idle）
          files: app/build/outputs/apk/profileable/*.apk
