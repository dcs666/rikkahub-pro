name: Release Turbo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.3-turbo)'
        required: false
        default: 'v1.1.3-turbo'
  push:
    tags: ['v*-turbo']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup fixed debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 not set, skipping fixed signing"
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "debug.storeFile=$RUNNER_TEMP/debug.keystore"
            echo "debug.storePassword=android"
            echo "debug.keyAlias=androiddebugkey"
            echo "debug.keyPassword=android"
          } >> local.properties

      - name: Build profileable APK
        run: ./gradlew assembleProfileable --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: false
          body: |
            RikkaHub Turbo ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

            ## DeepSeek 思考模式对齐（V4）
            - `XHIGH → reasoning_effort=max`：ChatCompletions / Responses / Anthropic 三条官方路径统一
            - 工具调用场景下思维链以明文 `content` 回传（DeepSeek 不支持 summary 字段）
            - 思考模式不再发送 `temperature` / `top_p`（官方文档：不生效）
            - 解析并上报 `reasoning_tokens`（思维链 token 消耗）

            ## 其他
            - 思考档位 UI 标签更新为 max
            - 单元测试覆盖全部 6 档 × V4-Flash/V4-Pro
          files: app/build/outputs/apk/profileable/*.apk
