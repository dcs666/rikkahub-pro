name: Unit Tests

on:
  push:
    branches: [ master, main, 'perf/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# [FIX] 连续 push 时只测试最新代码（与 build.yml 保持一致）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run ai module unit tests
        run: ./gradlew :ai:testDebugUnitTest --stacktrace

      # app 模块的 JVM 测试（task 系统测试等）。
      # [FIX] 曾用 continue-on-error 掩盖了 app 编译失败（Build APK 才暴露），
      # 改为严格模式：编译或测试失败立即红，问题不再被吞掉。
      - name: Run app module unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
