name: Build APK

on:
  push:
    branches: [ master, main, 'perf/**' ]
    # [OPT] 仅修改 .github/（workflow 配置）不触发构建——app 代码没变时
    # 不必重跑 30-60 分钟的 assembleProfileable
    paths-ignore: ['.github/**']
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# [FIX] 连续 push 时只构建最新代码：旧 run 排队/运行中会被取消，
# 避免单 runner 上 10 个 commit 各自重复全量构建（每个 30-60min）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 冷启动（cache miss）+ 网络高峰时 Gradle 依赖下载可能超 30 分钟，
    # 之前构建被 kill 过；cache 命中后实际只需 7-10 分钟
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      # [OPT] web-ui node_modules 缓存（按 lock 文件 hash）：
      # pnpm store 缓存只省下载，install 仍要跑；缓存 node_modules 可跳过
      # 整个 install + vite 依赖解析
      - name: Cache web-ui node_modules
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: ${{ runner.os }}-webui-${{ hashFiles('web-ui/pnpm-lock.yaml') }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            # [OPT] 项目级 .gradle：Kotlin 增量编译状态 + 配置缓存跨 run 保留。
            # 改 1 个文件时只重编依赖链（而非模块全量）；runner 工作目录固定，
            # 绝对路径引用有效。cache 保存时同 key 覆盖，增量状态每次更新。
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          # gradle 文件变更时 key 失效：回退到最近一次缓存（依赖部分仍命中）
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup fixed debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 not set, skipping fixed signing"
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "debug.storeFile=$RUNNER_TEMP/debug.keystore"
            echo "debug.storePassword=android"
            echo "debug.keyAlias=androiddebugkey"
            echo "debug.keyPassword=android"
          } >> local.properties

      # [OPT] 快速失败：先只编译 Kotlin（编译错误 ~5 分钟暴露，不再等 30 分钟打包）。
      # 同一 workspace 内 .gradle 增量状态直接被下一步复用——assemble 时
      # Kotlin 编译几乎零成本（输入未变 → UP-TO-DATE），总时长不增反减。
      - name: Compile Kotlin (fast fail)
        run: ./gradlew :app:compileProfileableKotlin --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleProfileable --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-turbo-profileable
          path: app/build/outputs/apk/profileable/*.apk
          retention-days: 7

      - name: Upload Room schemas
        # [FIX] 仓库 schemas 目录只提交到 24.json（25/26 由 CI 生成但从未入库），
        # 导致 24→25/25→26 迁移无法用 MigrationTestHelper 验证（需对应 schema）。
        # 每次构建上传生成的 schema，人工定期提交回仓库。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/me.rerere.rikkahub.data.db.AppDatabase/*.json
          retention-days: 14
