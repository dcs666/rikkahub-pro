name: Release Turbo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.5-turbo)'
        required: false
        default: ''
  push:
    tags: ['v*-turbo']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # [TURBO] 与 build/test 对齐：Gradle 官方 action 管理 ~/.gradle
      #（依赖 + 构建缓存 + daemon），项目级 .gradle 增量状态单独缓存，
      # 发布构建复用日常 CI 的编译产物（改动少时快速出包）
      - name: Setup Gradle (deps + build cache + daemon)
        uses: gradle/actions/setup-gradle@v3

      - name: Cache project .gradle state
        uses: actions/cache@v4
        with:
          path: .gradle
          key: ${{ runner.os }}-gradle-project-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-project-

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup fixed debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 not set, skipping fixed signing"
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "debug.storeFile=$RUNNER_TEMP/debug.keystore"
            echo "debug.storePassword=android"
            echo "debug.keyAlias=androiddebugkey"
            echo "debug.keyPassword=android"
          } >> local.properties

      - name: Build profileable APK
        run: ./gradlew assembleProfileable --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: false
          body: |
            RikkaHub Turbo ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

            ## 异步后台任务队列 + 事件驱动 AI
            - **CI 监控**：AI 调用 `background_task` 工具创建 GitHub Actions 监控，后台轮询状态
            - **自动通知**：CI 完成时弹 Android 通知，结果自动注入关联对话
            - **AI 自动分析**：CI 失败时自动触发 AI 分析错误日志并建议修复
            - **定时器**：支持创建延时任务（秒/分钟/毫秒精度）
            - **Webhook**：GitHub Actions 可直接推送到手机（局域网），即时完成监控
            - **任务管理 UI**：设置 → Background Tasks，查看/取消任务
            - **GitHub Token 配置**：支持私有 repo 监控
            - **指数退避**：轮询间隔自适应（30s→5min），省电省 API 配额
            - **去重**：同 repo+branch 不重复创建监控
            - **REST API**：`/api/tasks/*` 端点（CI 监控/定时器/Webhook/取消）

            ## 技术细节
            - Room DB v24→25（AutoMigration），background_tasks 表含索引
            - 120 轮深度代码审查：竞态修复、JSON 注入防护、Okio API 修正等
            - 自适应轮询（5s active / 30s idle）
          files: app/build/outputs/apk/profileable/*.apk
