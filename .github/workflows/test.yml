name: Unit Tests

on:
  push:
    branches: [ master, main, 'perf/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# [FIX] 连续 push 时只测试最新代码（与 build.yml 保持一致）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # [FIX] 冷启动（cache miss）+ 网络高峰时 Gradle 依赖下载可能超 30 分钟，
    # 与 build.yml 对齐到 45min
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            # [FIX] 与 build.yml 对齐：项目级 .gradle 保留 Kotlin 增量编译状态，
            # 避免每次 test 都全量编译（冷编译在 30min 内极可能超时失败）
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # [FIX] :app:testDebugUnitTest 依赖 :web:buildWebUi（构建 web-ui 静态资源），
      # 没有 pnpm/Node 会直接失败（曾因 continue-on-error 被掩盖）。
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # [OPT] 与 build.yml 对齐：缓存 web-ui node_modules，跳过 pnpm install 的依赖解析
      - name: Cache web-ui node_modules
        uses: actions/cache@v4
        with:
          path: web-ui/node_modules
          key: ${{ runner.os }}-webui-${{ hashFiles('web-ui/pnpm-lock.yaml') }}

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Run ai module unit tests
        run: ./gradlew :ai:testDebugUnitTest --stacktrace

      # app 模块的 JVM 测试（task 系统测试等）。
      # [FIX] 曾用 continue-on-error 掩盖了 app 编译失败（Build APK 才暴露），
      # 改为严格模式：编译或测试失败立即红，问题不再被吞掉。
      - name: Run app module unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
