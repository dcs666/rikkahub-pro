name: Build APK

on:
  push:
    branches: [ master, main, 'perf/**' ]
    # [OPT] 仅修改 .github/（workflow 配置）不触发构建——app 代码没变时
    # 不必重跑 30-60 分钟的 assembleProfileable
    paths-ignore: ['.github/**']
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# [FIX] 连续 push 时只构建最新代码：旧 run 排队/运行中会被取消，
# 避免单 runner 上 10 个 commit 各自重复全量构建（每个 30-60min）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup fixed debug signing
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "DEBUG_KEYSTORE_B64 not set, skipping fixed signing"
            exit 0
          fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          {
            echo "debug.storeFile=$RUNNER_TEMP/debug.keystore"
            echo "debug.storePassword=android"
            echo "debug.keyAlias=androiddebugkey"
            echo "debug.keyPassword=android"
          } >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleProfileable --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-turbo-profileable
          path: app/build/outputs/apk/profileable/*.apk
          retention-days: 7
